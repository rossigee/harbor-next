name: Setup Task
description: Install Task CLI without a JavaScript action runtime

inputs:
  version:
    description: Task version to install
    required: false
    default: 3.49.1

runs:
  using: composite
  steps:
    - name: Install Task
      shell: bash
      env:
        TASK_VERSION: ${{ inputs.version }}
      run: | # zizmor: ignore[github-env] Adds only this action's checksum-verified Task install directory to PATH.
        set -euo pipefail

        version="${TASK_VERSION}"
        version="${version#v}"

        case "$(uname -s)" in
          Linux) os="linux" ;;
          Darwin) os="darwin" ;;
          *) echo "Unsupported OS for Task: $(uname -s)" >&2; exit 1 ;;
        esac

        case "$(uname -m)" in
          x86_64|amd64) arch="amd64" ;;
          aarch64|arm64) arch="arm64" ;;
          *) echo "Unsupported architecture for Task: $(uname -m)" >&2; exit 1 ;;
        esac

        archive="task_${os}_${arch}.tar.gz"
        tool_dir="${RUNNER_TEMP:-${PWD}/.tools}/task"
        mkdir -p "${tool_dir}/bin"
        curl -fsSL "https://github.com/go-task/task/releases/download/v${version}/${archive}" -o "${tool_dir}/${archive}"
        curl -fsSL "https://github.com/go-task/task/releases/download/v${version}/task_checksums.txt" -o "${tool_dir}/task_checksums.txt"
        expected_checksum=$(awk -v archive="${archive}" '$2 == archive { print $1 }' "${tool_dir}/task_checksums.txt")
        if [ -z "${expected_checksum}" ]; then
          echo "Checksum for ${archive} not found" >&2
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          actual_checksum=$(sha256sum "${tool_dir}/${archive}" | awk '{ print $1 }')
        else
          actual_checksum=$(shasum -a 256 "${tool_dir}/${archive}" | awk '{ print $1 }')
        fi
        if [ "${actual_checksum}" != "${expected_checksum}" ]; then
          echo "Checksum mismatch for ${archive}" >&2
          exit 1
        fi
        tar -xzf "${tool_dir}/${archive}" -C "${tool_dir}" task
        install -m 0755 "${tool_dir}/task" "${tool_dir}/bin/task"
        echo "${tool_dir}/bin" >> "${GITHUB_PATH}"

    - name: Verify Task
      shell: bash
      run: task --version
